name: eval

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Never pull_request_target: fork code must not run with secrets. Forks get no secrets, so their runs skip.
permissions:
  contents: read

# A newer push makes the older run's answers moot; stop paying for them.
concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run eval
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_EVAL_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_EVAL_KEY }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-results
          path: evals/results/
          if-no-files-found: ignore
